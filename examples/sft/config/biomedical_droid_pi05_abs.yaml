defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: biomedical_droid_pi05_abs_sft
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: /mnt/datadisk/datasets/lerobot/embodied_fusion/biomedical_droid_abs
  num_workers: 8

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 16
  seed: 42

  model:
    model_path: /mnt/datadisk/models/RLinf/pi05_droid_openpi_rlinf
    # Full-parameter fine-tuning. Set this to true only for an explicit LoRA run.
    is_lora: false
    num_action_chunks: 15
    action_dim: 8
    openpi:
      task: sft
      config_name: pi05_droid_finetune_abs
      num_images_in_input: 3
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      model_action_dim: 32
      max_token_len: 200
    openpi_data:
      norm_stats_path: /mnt/datadisk/datasets/lerobot/embodied_fusion/biomedical_droid_abs/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
