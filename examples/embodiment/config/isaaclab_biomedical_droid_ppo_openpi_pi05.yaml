defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/pi0_5_pytorch@actor.model
  - model/pi0_5_pytorch@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:EMBODIED_FUSION_ROOT,.}/embodied_fusion_logs/rlinf/isaaclab_biomedical_droid_ppo_openpi_pi05
    project_name: rlinf
    experiment_name: isaaclab_biomedical_droid_ppo_openpi_pi05
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 100
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 8
    max_episode_steps: 448
    max_steps_per_rollout_epoch: 448
    use_fixed_reset_state_ids: true
    seed: 42
    init_params:
      id: EmbodiedFusion-Biomedical-PickMedicineConveyor-Franka-DROID-JointPos-v0
      state_interface: droid_joint
      scene_config: embodied_fusion/rlinf/config/scenes/biomedical.yaml
      task_description: Pick a plastic bottle from the wooden crate and place it on the gray conveyor belt in front of the robot.
      table_cam: {height: 720, width: 1280}
      wrist_cam: {height: 720, width: 1280}
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    max_episode_steps: 448
    max_steps_per_rollout_epoch: 448
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    seed: 42
    init_params:
      id: EmbodiedFusion-Biomedical-PickMedicineConveyor-Franka-DROID-JointPos-v0
      state_interface: droid_joint
      scene_config: embodied_fusion/rlinf/config/scenes/biomedical.yaml
      task_description: Pick a plastic bottle from the wooden crate and place it on the gray conveyor belt in front of the robot.
      table_cam: {height: 720, width: 1280}
      wrist_cam: {height: 720, width: 1280}
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:RLINF_DROID_PI05_MODEL_PATH,/mnt/datadisk/models/RLinf/pi05_droid_pytorch}
    model_type: openpi_pytorch
    precision: bf16
    num_action_chunks: 8
    action_dim: 8
    num_steps: 5
    openpi:
      task: eval
      config_name: pi05_droid_polaris
      num_images_in_input: 2
      noise_level: 0.5
      action_env_dim: 8
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
    openpi_data:
      norm_stats_path: ${..model_path}/physical-intelligence/behavior/norm_stats.json

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: 42
  enable_offload: false
  model:
    model_path: ${oc.env:RLINF_DROID_PI05_MODEL_PATH,/mnt/datadisk/models/RLinf/pi05_droid_pytorch}
    model_type: openpi_pytorch
    precision: bf16
    action_dim: 8
    num_action_chunks: 8
    num_steps: 5
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_droid_polaris
      num_images_in_input: 2
      noise_level: 0.4
      noise_method: flow_sde
      ignore_last: true
      train_expert_only: true
      joint_logprob: false
      num_steps: ${actor.model.num_steps}
      action_env_dim: 8
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
    openpi_data:
      norm_stats_path: ${..model_path}/physical-intelligence/behavior/norm_stats.json
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: false

critic:
  use_critic_model: false
